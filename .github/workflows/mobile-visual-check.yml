name: Temporary mobile visual check

on:
  push:
    branches: [chatgpt/final-launch-audit]

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 >/tmp/preview.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/preview.log
          exit 1
      - name: Capture mobile homepage
        run: |
          mkdir -p mobile-visual-check
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          for (const [name,width,height] of [['galaxy-s8',360,800],['mobile-390',390,844]]) {
            const context = await browser.newContext({ viewport: { width, height } })
            const page = await context.newPage()
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
            await page.evaluate(async () => {
              for (let y = 0; y < document.documentElement.scrollHeight; y += 600) {
                window.scrollTo(0,y)
                await new Promise(r => setTimeout(r,30))
              }
              window.scrollTo(0,0)
            })
            await page.waitForTimeout(150)
            await page.screenshot({ path: `mobile-visual-check/${name}.png`, fullPage: true })
            await context.close()
          }
          await browser.close()
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-check
          path: mobile-visual-check
          retention-days: 1
