name: Strict homepage visual QA

on:
  push:
    branches:
      - chatgpt/strict-homepage-pass-1
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/digi02-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/digi02-preview.log
          exit 1

      - name: Capture painted desktop, tablet and mobile pages
        run: |
          mkdir -p visual-qa
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })
          const targets = [
            { name: 'desktop-1440.png', width: 1440, height: 1000 },
            { name: 'tablet-1024.png', width: 1024, height: 1366 },
            { name: 'mobile-390.png', width: 390, height: 844 },
          ]

          async function paintWholePage(page, viewportHeight) {
            let y = 0
            let previousHeight = 0

            while (true) {
              const pageHeight = await page.evaluate(() => document.documentElement.scrollHeight)
              if (y >= pageHeight) break

              await page.evaluate((nextY) => window.scrollTo(0, nextY), y)
              await page.waitForTimeout(140)
              y += Math.max(Math.floor(viewportHeight * 0.72), 500)

              if (pageHeight === previousHeight && y > pageHeight) break
              previousHeight = pageHeight
            }

            await page.evaluate(() => window.scrollTo(0, document.documentElement.scrollHeight))
            await page.waitForTimeout(350)

            await page.evaluate(async () => {
              const images = Array.from(document.images)
              await Promise.all(
                images.map(async (image) => {
                  if (!image.complete) {
                    await new Promise((resolve) => {
                      image.addEventListener('load', resolve, { once: true })
                      image.addEventListener('error', resolve, { once: true })
                    })
                  }

                  if (typeof image.decode === 'function') {
                    await image.decode().catch(() => undefined)
                  }
                }),
              )
            })

            await page.evaluate(() => window.scrollTo(0, 0))
            await page.waitForTimeout(250)
          }

          for (const target of targets) {
            const page = await browser.newPage({
              viewport: { width: target.width, height: target.height },
              deviceScaleFactor: 1,
            })

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
            await paintWholePage(page, target.height)
            await page.screenshot({ path: `visual-qa/${target.name}`, fullPage: true })
            await page.close()
          }

          await browser.close()
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: strict-homepage-visual-qa
          path: visual-qa/
          retention-days: 1
