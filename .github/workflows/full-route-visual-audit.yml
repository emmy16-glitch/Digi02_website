name: Full route visual audit

on:
  push:
    branches:
      - chatgpt/final-launch-audit
  workflow_dispatch:

concurrency:
  group: full-route-visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/digi02-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/digi02-preview.log
          exit 1

      - name: Capture every public route
        run: |
          mkdir -p full-route-visual-audit
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { chromium } from 'playwright'

          const routes = [
            ['home', '/'],
            ['solutions', '/solutions'],
            ['skygrid', '/solutions/skygrid'],
            ['digivolt', '/solutions/digivolt'],
            ['enterprise-systems', '/solutions/enterprise-systems'],
            ['e-management', '/solutions/e-management'],
            ['payroll-automation', '/solutions/payroll-automation'],
            ['payment-systems', '/solutions/payment-systems'],
            ['custom-software', '/solutions/custom-software'],
            ['industries', '/industries'],
            ['work', '/work'],
            ['company', '/company'],
            ['insights', '/insights'],
            ['contact', '/contact'],
          ]

          const viewports = [
            ['desktop', 1440, 1000],
            ['tablet', 1024, 900],
            ['mobile', 390, 844],
          ]

          const browser = await chromium.launch()
          for (const [viewportName, width, height] of viewports) {
            const context = await browser.newContext({ viewport: { width, height }, deviceScaleFactor: 1 })
            const page = await context.newPage()
            for (const [name, route] of routes) {
              await page.goto(`http://127.0.0.1:4173${route}`, { waitUntil: 'load' })
              await page.waitForTimeout(800)

              const metrics = await page.evaluate(() => ({
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                brokenImages: [...document.images].filter((img) => !img.complete || img.naturalWidth === 0).map((img) => img.src),
                h1Count: document.querySelectorAll('h1').length,
                mainExists: Boolean(document.querySelector('main#main-content')),
              }))

              assert.equal(metrics.h1Count, 1, `${route} must contain exactly one h1`)
              assert.equal(metrics.mainExists, true, `${route} must contain main#main-content`)
              assert.ok(metrics.scrollWidth <= metrics.clientWidth + 1, `${route} overflows horizontally at ${width}px`)
              assert.deepEqual(metrics.brokenImages, [], `${route} contains broken images at ${width}px`)

              await page.screenshot({
                path: `full-route-visual-audit/${name}-${viewportName}.png`,
                fullPage: true,
                animations: 'disabled',
              })
            }
            await context.close()
          }
          await browser.close()
          NODE

      - name: Upload visual audit
        uses: actions/upload-artifact@v4
        with:
          name: full-route-visual-audit
          path: full-route-visual-audit
          retention-days: 1
