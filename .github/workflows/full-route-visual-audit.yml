name: Full route resource audit

on:
  push:
    branches:
      - chatgpt/final-launch-audit
  workflow_dispatch:

concurrency:
  group: full-route-resource-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/digi02-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/digi02-preview.log
          exit 1
      - name: Trace missing resources at phone width
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'
          const origin='http://127.0.0.1:4173'
          const routes=['/','/solutions','/solutions/skygrid','/solutions/digivolt','/solutions/enterprise-systems','/solutions/e-management','/solutions/payroll-automation','/solutions/payment-systems','/solutions/custom-software','/industries','/work','/company','/insights','/contact']
          const browser=await chromium.launch({headless:true})
          const context=await browser.newContext({viewport:{width:390,height:844}})
          const page=await context.newPage()
          const errors=[]
          page.on('console',m=>{
            if(m.type()==='error'){
              const loc=m.location()
              errors.push(`console: ${m.text()} | ${loc.url||'no-url'}:${loc.lineNumber||0}:${loc.columnNumber||0}`)
            }
          })
          page.on('response',r=>{if(r.status()>=400) errors.push(`response: ${r.status()} ${r.url()}`)})
          page.on('requestfailed',r=>errors.push(`requestfailed: ${r.url()} | ${r.failure()?.errorText||'unknown'}`))
          for(const route of routes){
            console.log(`ROUTE ${route}`)
            await page.goto(origin+route,{waitUntil:'networkidle'})
            await page.waitForTimeout(250)
          }
          await browser.close()
          if(errors.length){console.error('\nRESOURCE ERRORS\n'+[...new Set(errors)].join('\n'));process.exit(1)}
          console.log('No resource errors detected.')
          NODE
