name: Final launch audit

on:
  push:
    branches:
      - chatgpt/final-launch-audit
  workflow_dispatch:

jobs:
  launch-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Guard launch copy and retired content
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'

          const roots = ['src/pages', 'src/sections', 'src/components']
          const files = []
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(full)
              else if (/\.(tsx|ts)$/.test(entry.name)) files.push(full)
            }
          }
          roots.forEach((root) => fs.existsSync(root) && walk(root))

          const bannedCopy = [
            /\bseamless(?:ly)?\b/i,
            /\binnovative\b/i,
            /\brevolutionary\b/i,
            /\bcutting[- ]edge\b/i,
            /\bempower(?:ing|ed|s)?\b/i,
            /\bunlock(?:ing|ed|s)?\b/i,
            /\bnext[- ]gen(?:eration)?\b/i,
            /\btransformative\b/i,
            /\bfuture[- ]ready\b/i,
            /\bredefine(?:d|s|ing)?\b/i,
            /\bgame[- ]chang(?:er|ing)\b/i,
            /\bworld[- ]class\b/i,
            /\bleading[- ]edge\b/i,
          ]
          const retiredReferences = [
            'skygrid-route-planner',
            'skygrid-gcs-mission-planner',
            'skygrid-operations-center',
            'skygrid-mission-analytics',
            '/blog/erp-solutions-nigeria.html',
            '/blog/payroll-solutions-nigeria.html',
            '/blog/payment-solutions-nigeria.html',
            '/blog/uav-autopilot-nigeria.html',
          ]

          const errors = []
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8')
            for (const pattern of bannedCopy) {
              if (pattern.test(text)) errors.push(`${file}: generic marketing phrase ${pattern}`)
            }
            if (!file.includes('FoundationPreviewPage')) {
              for (const reference of retiredReferences) {
                if (text.includes(reference)) errors.push(`${file}: retired reference ${reference}`)
              }
            }
          }

          if (errors.length) {
            console.error(errors.join('\n'))
            process.exit(1)
          }
          NODE

      - name: Install Playwright browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/digi02-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/digi02-preview.log
          exit 1

      - name: Run responsive, interaction and browser QA
        run: |
          mkdir -p final-launch-audit
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { chromium, firefox, webkit } from 'playwright'

          const origin = 'http://127.0.0.1:4173'
          const routes = [
            '/', '/solutions', '/solutions/skygrid', '/solutions/digivolt',
            '/solutions/enterprise-systems', '/solutions/e-management',
            '/solutions/payroll-automation', '/solutions/payment-systems',
            '/solutions/custom-software', '/industries', '/work', '/company',
            '/insights', '/contact',
          ]
          const routeSet = new Set(routes)
          const chromiumViewports = [
            ['phone-320', 320, 720],
            ['phone-360', 360, 800],
            ['phone-390', 390, 844],
            ['phone-430', 430, 932],
            ['tablet-768', 768, 1024],
            ['tablet-1024', 1024, 1366],
            ['desktop-1280', 1280, 900],
            ['desktop-1440', 1440, 1000],
          ]
          const smokeRoutes = ['/', '/solutions/skygrid', '/solutions/digivolt', '/solutions/enterprise-systems', '/company', '/contact']
          const errors = []

          async function paint(page) {
            await page.evaluate(async () => {
              const step = Math.max(window.innerHeight * 0.8, 500)
              for (let y = 0; y < document.documentElement.scrollHeight; y += step) {
                window.scrollTo(0, y)
                await new Promise((resolve) => setTimeout(resolve, 20))
              }
              window.scrollTo(0, 0)
            })
            await page.waitForTimeout(60)
          }

          function guard(page, label) {
            page.on('console', (message) => {
              if (message.type() === 'error') errors.push(`${label}: console ${message.text()}`)
            })
            page.on('pageerror', (error) => errors.push(`${label}: pageerror ${error.message}`))
            page.on('response', (response) => {
              if (response.url().startsWith(origin) && response.status() >= 400) {
                errors.push(`${label}: ${response.status()} ${response.url()}`)
              }
            })
          }

          async function inspect(page, route, viewportName) {
            const label = `${route} @ ${viewportName}`
            await page.goto(`${origin}${route}`, { waitUntil: 'networkidle' })
            await page.locator('main').waitFor({ state: 'visible' })
            await paint(page)

            assert.ok((await page.title()).includes('Digi02'), `${label}: title does not identify Digi02`)
            assert.equal(await page.locator('main h1').count(), 1, `${label}: expected exactly one H1`)
            assert.equal(await page.locator('a.skip-link[href="#main-content"]').count(), 1, `${label}: skip link missing`)

            const metrics = await page.evaluate(() => {
              const ids = [...document.querySelectorAll('[id]')].map((element) => element.id)
              return {
                clientWidth: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
                duplicateIds: ids.filter((id, index) => ids.indexOf(id) !== index),
              }
            })
            assert.ok(metrics.scrollWidth <= metrics.clientWidth + 1, `${label}: horizontal overflow ${metrics.scrollWidth}/${metrics.clientWidth}`)
            assert.deepEqual(metrics.duplicateIds, [], `${label}: duplicate IDs ${metrics.duplicateIds.join(', ')}`)

            const badImages = await page.locator('img').evaluateAll((images) => images
              .filter((image) => !image.complete || image.naturalWidth === 0)
              .map((image) => image.getAttribute('src')))
            assert.deepEqual(badImages, [], `${label}: broken images ${badImages.join(', ')}`)

            const unlabeled = await page.locator('button, input, textarea, select').evaluateAll((controls) => controls
              .filter((element) => {
                if (element instanceof HTMLInputElement && element.type === 'hidden') return false
                if (element.getAttribute('aria-label') || element.getAttribute('aria-labelledby')) return false
                if (element instanceof HTMLButtonElement) return !element.textContent?.trim()
                return !element.labels?.length
              })
              .map((element) => `${element.tagName.toLowerCase()}[name="${element.getAttribute('name') ?? ''}"]`))
            assert.deepEqual(unlabeled, [], `${label}: unlabeled controls ${unlabeled.join(', ')}`)

            const internalHrefs = await page.locator('a[href^="/"]').evaluateAll((anchors) => [...new Set(anchors.map((anchor) => anchor.getAttribute('href')).filter(Boolean))])
            for (const href of internalHrefs) {
              const pathname = new URL(href, origin).pathname.replace(/\/$/, '') || '/'
              assert.ok(routeSet.has(pathname), `${label}: unknown internal route ${href}`)
            }

            if (viewportName.startsWith('phone')) {
              const smallTargets = await page.locator('header a, header button, form button, form input, form select').evaluateAll((elements) => elements
                .map((element) => ({
                  text: (element.textContent || element.getAttribute('aria-label') || element.getAttribute('name') || element.tagName).trim().slice(0, 40),
                  rect: element.getBoundingClientRect(),
                }))
                .filter(({ rect }) => rect.width > 0 && rect.height > 0 && rect.height < 42)
                .map(({ text, rect }) => `${text}:${Math.round(rect.width)}x${Math.round(rect.height)}`))
              assert.deepEqual(smallTargets, [], `${label}: undersized touch targets ${smallTargets.join(', ')}`)
            }
          }

          const chrome = await chromium.launch({ headless: true })
          for (const [name, width, height] of chromiumViewports) {
            const context = await chrome.newContext({ viewport: { width, height } })
            const page = await context.newPage()
            guard(page, `chromium ${name}`)
            for (const route of routes) await inspect(page, route, name)
            await context.close()
          }

          // Mobile navigation must lock background scroll, close on Escape and restore focus.
          {
            const context = await chrome.newContext({ viewport: { width: 390, height: 844 } })
            const page = await context.newPage()
            await page.goto(origin, { waitUntil: 'networkidle' })
            const toggle = page.getByRole('button', { name: 'Open navigation menu' })
            await toggle.click()
            await page.getByRole('navigation', { name: 'Mobile primary navigation' }).waitFor()
            assert.equal(await page.locator('body').evaluate((body) => body.style.overflow), 'hidden')
            await page.keyboard.press('Escape')
            await page.waitForTimeout(50)
            assert.equal(await toggle.getAttribute('aria-expanded'), 'false')
            assert.equal(await toggle.evaluate((element) => document.activeElement === element), true)
            await context.close()
          }

          // Core homepage interactions.
          {
            const context = await chrome.newContext({ viewport: { width: 1280, height: 900 } })
            const page = await context.newPage()
            await page.goto(origin, { waitUntil: 'networkidle' })

            const automate = page.getByRole('tab', { name: /Automate/i }).first()
            await automate.click()
            assert.equal(await automate.getAttribute('aria-selected'), 'true')
            await automate.press('End')
            const transact = page.getByRole('tab', { name: /Transact/i }).first()
            assert.equal(await transact.getAttribute('aria-selected'), 'true')
            assert.equal(await transact.evaluate((element) => document.activeElement === element), true)

            const skygridReview = page.getByRole('tab', { name: 'Review' }).first()
            await skygridReview.click()
            assert.equal(await skygridReview.getAttribute('aria-selected'), 'true')

            const arrive = page.getByRole('tab', { name: /Arrive/i }).first()
            await arrive.click()
            await page.waitForTimeout(750)
            assert.equal(await arrive.getAttribute('aria-selected'), 'true')
            assert.ok((await page.locator('.digivolt-journey__stage-copy strong').textContent())?.includes('Trip complete'))
            await context.close()
          }

          // ERP sample sale must update stock and reset cleanly.
          {
            const context = await chrome.newContext({ viewport: { width: 1280, height: 900 } })
            const page = await context.newPage()
            await page.goto(`${origin}/solutions/enterprise-systems`, { waitUntil: 'networkidle' })
            const row = page.locator('.erp-pos-product-row').filter({ hasText: 'Wireless Headset' })
            assert.ok((await row.textContent())?.includes('24'))
            await row.getByRole('button', { name: 'Add' }).click()
            await page.getByText('Transfer', { exact: true }).last().click()
            await page.getByRole('button', { name: /Complete sale/i }).click()
            await page.locator('.erp-pos-receipt-drawer[data-open="true"]').waitFor()
            assert.ok((await row.textContent())?.includes('23'))
            assert.ok((await page.locator('.erp-pos-receipt__payment').textContent())?.includes('Transfer'))
            await page.getByRole('button', { name: 'Reset demo' }).click()
            assert.ok((await row.textContent())?.includes('24'))
            await context.close()
          }

          // Contact form must require the core brief and remain explicit about email preparation.
          {
            const context = await chrome.newContext({ viewport: { width: 390, height: 844 } })
            const page = await context.newPage()
            await page.goto(`${origin}/contact`, { waitUntil: 'networkidle' })
            await page.getByRole('button', { name: /Prepare enquiry/i }).click()
            assert.equal(await page.locator('input[name="name"]:invalid').count(), 1)
            assert.equal(await page.locator('select[name="area"]:invalid').count(), 1)
            assert.ok((await page.locator('.contact-form__privacy').textContent())?.includes('does not send or store'))
            await context.close()
          }

          // Representative evidence for manual review.
          const captureRoutes = [
            ['/', 'home'], ['/solutions', 'solutions'], ['/solutions/skygrid', 'skygrid'],
            ['/solutions/digivolt', 'digivolt'], ['/solutions/enterprise-systems', 'erp'],
            ['/company', 'company'], ['/contact', 'contact'], ['/insights', 'insights'],
          ]
          for (const [route, file] of captureRoutes) {
            for (const [name, width, height] of [['mobile', 390, 844], ['tablet', 1024, 1366], ['desktop', 1440, 1000]]) {
              const context = await chrome.newContext({ viewport: { width, height } })
              const page = await context.newPage()
              await page.goto(`${origin}${route}`, { waitUntil: 'networkidle' })
              await paint(page)
              await page.screenshot({ path: `final-launch-audit/${file}-${name}.png`, fullPage: true })
              await context.close()
            }
          }
          await chrome.close()

          // Safari/WebKit and Firefox smoke tests on the complex destinations.
          for (const [engineName, launcher] of [['firefox', firefox], ['webkit', webkit]]) {
            const browser = await launcher.launch({ headless: true })
            for (const [name, width, height] of [['mobile', 390, 844], ['desktop', 1440, 1000]]) {
              const context = await browser.newContext({ viewport: { width, height } })
              const page = await context.newPage()
              guard(page, `${engineName} ${name}`)
              for (const route of smokeRoutes) await inspect(page, route, `${engineName}-${name}`)
              await context.close()
            }
            await browser.close()
          }

          assert.deepEqual(errors, [], `Browser/runtime errors:\n${errors.join('\n')}`)
          NODE

      - name: Upload final launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-launch-audit
          path: final-launch-audit
          retention-days: 3
