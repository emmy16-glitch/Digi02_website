name: Final launch diagnostics

on:
  push:
    branches:
      - chatgpt/final-launch-audit
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 >/tmp/preview.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Collect 320px diagnostics
        run: |
          mkdir -p final-launch-diagnostics
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { chromium } from 'playwright'

          const origin = 'http://127.0.0.1:4173'
          const routes = ['/', '/solutions', '/solutions/skygrid', '/solutions/digivolt', '/solutions/enterprise-systems', '/solutions/e-management', '/solutions/payroll-automation', '/solutions/payment-systems', '/solutions/custom-software', '/industries', '/work', '/company', '/insights', '/contact']
          const browser = await chromium.launch({ headless: true })
          const results = []

          for (const route of routes) {
            const page = await browser.newPage({ viewport: { width: 320, height: 720 } })
            const consoleErrors = []
            page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()) })
            page.on('pageerror', (error) => consoleErrors.push(error.message))
            await page.goto(`${origin}${route}`, { waitUntil: 'networkidle' })
            await page.evaluate(async () => {
              for (let y = 0; y < document.documentElement.scrollHeight; y += 550) {
                window.scrollTo(0, y)
                await new Promise((resolve) => setTimeout(resolve, 20))
              }
              window.scrollTo(0, 0)
            })
            await page.waitForTimeout(100)

            const data = await page.evaluate(() => {
              const ids = [...document.querySelectorAll('[id]')].map((element) => element.id)
              const touch = [...document.querySelectorAll('header a, header button, form button, form input, form select')]
                .map((element) => {
                  const rect = element.getBoundingClientRect()
                  return {
                    tag: element.tagName,
                    text: (element.textContent || element.getAttribute('aria-label') || element.getAttribute('name') || '').trim().slice(0, 80),
                    width: Math.round(rect.width),
                    height: Math.round(rect.height),
                    display: getComputedStyle(element).display,
                    opacity: getComputedStyle(element).opacity,
                  }
                })
                .filter((item) => item.width > 0 && item.height > 0 && item.height < 42)
              const unlabeled = [...document.querySelectorAll('button, input, textarea, select')]
                .filter((element) => {
                  if (element instanceof HTMLInputElement && element.type === 'hidden') return false
                  if (element.getAttribute('aria-label') || element.getAttribute('aria-labelledby')) return false
                  if (element instanceof HTMLButtonElement) return !element.textContent?.trim()
                  return !element.labels?.length
                })
                .map((element) => `${element.tagName}:${element.getAttribute('name') || element.textContent?.trim() || ''}`)
              const badImages = [...document.images].filter((image) => !image.complete || image.naturalWidth === 0).map((image) => image.src)
              return {
                title: document.title,
                h1Count: document.querySelectorAll('main h1').length,
                clientWidth: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
                duplicateIds: ids.filter((id, index) => ids.indexOf(id) !== index),
                touch,
                unlabeled,
                badImages,
              }
            })
            results.push({ route, ...data, consoleErrors })
            await page.screenshot({ path: `final-launch-diagnostics/${route === '/' ? 'home' : route.replaceAll('/', '-')}.png`, fullPage: true })
            await page.close()
          }

          fs.writeFileSync('final-launch-diagnostics/report.json', JSON.stringify(results, null, 2))
          console.log(JSON.stringify(results, null, 2))
          await browser.close()
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: final-launch-diagnostics
          path: final-launch-diagnostics
          retention-days: 1
