name: SkyGrid cinematic QA

on:
  push:
    branches:
      - chatgpt/skygrid-cinematic-no-app-screens
  workflow_dispatch:

jobs:
  skygrid-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/digi02-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/digi02-preview.log
          exit 1

      - name: Run SkyGrid interaction and visual QA
        run: |
          mkdir -p skygrid-qa
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })

          async function openPage(width, height) {
            const page = await browser.newPage({
              viewport: { width, height },
              deviceScaleFactor: 1,
            })
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
            return page
          }

          async function paintWholePage(page, viewportHeight) {
            let y = 0
            while (true) {
              const height = await page.evaluate(() => document.documentElement.scrollHeight)
              if (y >= height) break
              await page.evaluate((nextY) => window.scrollTo(0, nextY), y)
              await page.waitForTimeout(100)
              y += Math.max(Math.floor(viewportHeight * 0.7), 500)
            }

            await page.evaluate(async () => {
              await Promise.all(
                Array.from(document.images).map(async (image) => {
                  if (!image.complete) {
                    await new Promise((resolve) => {
                      image.addEventListener('load', resolve, { once: true })
                      image.addEventListener('error', resolve, { once: true })
                    })
                  }
                  if (typeof image.decode === 'function') await image.decode().catch(() => undefined)
                }),
              )
              window.scrollTo(0, 0)
            })
            await page.waitForTimeout(250)
          }

          async function assertNoLegacySkyGridScreens(page) {
            const legacyNames = [
              'skygrid-route-planner',
              'skygrid-gcs-mission-planner',
              'skygrid-operations-center',
              'skygrid-mission-analytics',
              'skygrid-showcase-concept',
            ]

            for (const name of legacyNames) {
              assert.equal(
                await page.locator(`img[src*="${name}"]`).count(),
                0,
                `Legacy SkyGrid app screenshot is still rendered: ${name}`,
              )
            }
          }

          const desktop = await openPage(1440, 1000)
          await paintWholePage(desktop, 1000)
          await assertNoLegacySkyGridScreens(desktop)

          await desktop.getByAltText('SkyGrid').first().waitFor({ state: 'visible' })
          assert.ok(
            (await desktop.locator('img[src*="skygrid-cinematic-control-room"]').count()) >= 2,
            'Expected the SkyGrid cinematic asset in the hero and SkyGrid chapter',
          )

          const skygrid = desktop.locator('.skygrid-mission-sequence')
          await skygrid.scrollIntoViewIfNeeded()
          assert.equal(await skygrid.getAttribute('data-stage'), 'plan')

          const planTab = skygrid.getByRole('tab', { name: 'Plan' })
          const prepareTab = skygrid.getByRole('tab', { name: 'Prepare' })
          await planTab.focus()
          await planTab.press('ArrowRight')
          assert.equal(await skygrid.getAttribute('data-stage'), 'prepare')
          assert.equal(await prepareTab.evaluate((node) => node === document.activeElement), true)

          await skygrid.getByRole('tab', { name: 'Operate' }).click()
          assert.equal(await skygrid.getAttribute('data-stage'), 'operate')
          await skygrid.getByText('Aircraft in mission area').waitFor({ state: 'visible' })

          await skygrid.getByRole('tab', { name: 'Review' }).click()
          assert.equal(await skygrid.getAttribute('data-stage'), 'review')
          await skygrid.getByText('Route trace').waitFor({ state: 'visible' })
          await skygrid.screenshot({ path: 'skygrid-qa/desktop-skygrid-review.png' })
          await desktop.screenshot({ path: 'skygrid-qa/desktop-full.png', fullPage: true })

          const mobile = await openPage(390, 844)
          await paintWholePage(mobile, 844)
          await assertNoLegacySkyGridScreens(mobile)

          const overflow = await mobile.evaluate(() => ({
            clientWidth: document.documentElement.clientWidth,
            scrollWidth: document.documentElement.scrollWidth,
          }))
          assert.ok(
            overflow.scrollWidth <= overflow.clientWidth + 1,
            `Mobile page overflows horizontally: ${overflow.scrollWidth} > ${overflow.clientWidth}`,
          )

          const mobileSkygrid = mobile.locator('.skygrid-mission-sequence')
          await mobileSkygrid.scrollIntoViewIfNeeded()
          await mobileSkygrid.getByRole('tab', { name: 'Review' }).click()
          assert.equal(await mobileSkygrid.getAttribute('data-stage'), 'review')
          await mobileSkygrid.screenshot({ path: 'skygrid-qa/mobile-skygrid-review.png' })
          await mobile.screenshot({ path: 'skygrid-qa/mobile-full.png', fullPage: true })

          await desktop.close()
          await mobile.close()
          await browser.close()
          NODE

      - name: Upload SkyGrid QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: skygrid-cinematic-qa
          path: skygrid-qa/
          retention-days: 2
