name: Production readiness QA

on:
  push:
    branches:
      - chatgpt/production-readiness
  workflow_dispatch:

jobs:
  production-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate production files
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'

          const vercel = JSON.parse(fs.readFileSync('vercel.json', 'utf8'))
          assert.equal(vercel.routes?.[0]?.handle, 'filesystem', 'Vercel must preserve real files before SPA fallback')
          assert.equal(vercel.routes?.[1]?.dest, '/index.html', 'Vercel must fall back routes to index.html')

          const robots = fs.readFileSync('public/robots.txt', 'utf8')
          assert.match(robots, /Disallow: \/foundation/)
          assert.match(robots, /Sitemap: https:\/\/digi02\.org\/sitemap\.xml/)

          const sitemap = fs.readFileSync('public/sitemap.xml', 'utf8')
          for (const path of [
            '/',
            '/solutions',
            '/solutions/skygrid',
            '/solutions/digivolt',
            '/solutions/enterprise-systems',
            '/solutions/e-management',
            '/solutions/payroll-automation',
            '/solutions/payment-systems',
            '/solutions/custom-software',
            '/industries',
            '/work',
            '/company',
            '/insights',
            '/contact',
          ]) {
            const url = path === '/' ? 'https://digi02.org/' : `https://digi02.org${path}`
            assert.ok(sitemap.includes(`<loc>${url}</loc>`), `Sitemap missing ${url}`)
          }
          assert.ok(!sitemap.includes('/foundation'), 'Foundation route must not appear in sitemap')
          NODE

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/digi02-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/digi02-preview.log
          exit 1

      - name: Run route, metadata, contact and visual QA
        run: |
          mkdir -p production-readiness-qa
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { chromium } from 'playwright'

          const publicRoutes = [
            '/',
            '/solutions',
            '/solutions/skygrid',
            '/solutions/digivolt',
            '/solutions/enterprise-systems',
            '/solutions/e-management',
            '/solutions/payroll-automation',
            '/solutions/payment-systems',
            '/solutions/custom-software',
            '/industries',
            '/work',
            '/company',
            '/insights',
            '/contact',
          ]

          const browser = await chromium.launch({ headless: true })
          const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 } })

          for (const path of publicRoutes) {
            await desktop.goto(`http://127.0.0.1:4173${path}`, { waitUntil: 'networkidle' })

            const title = await desktop.title()
            assert.ok(title.includes('Digi02'), `${path} title should identify Digi02`)

            const description = await desktop.locator('meta[name="description"]').getAttribute('content')
            assert.ok(description && description.length >= 60, `${path} needs a substantive meta description`)

            const robots = await desktop.locator('meta[name="robots"]').getAttribute('content')
            assert.equal(robots, 'index, follow', `${path} should be indexable`)

            const canonical = await desktop.locator('link[rel="canonical"]').getAttribute('href')
            const expectedCanonical = path === '/' ? 'https://digi02.org' : `https://digi02.org${path}`
            assert.equal(canonical, expectedCanonical, `${path} canonical is incorrect`)

            assert.equal(await desktop.locator('meta[property="og:title"]').getAttribute('content'), title)
            assert.equal(await desktop.locator('meta[property="og:url"]').getAttribute('content'), expectedCanonical)
            assert.equal(await desktop.locator('meta[name="twitter:card"]').getAttribute('content'), 'summary')

            const schemaText = await desktop.locator('script[type="application/ld+json"]').textContent()
            const schema = JSON.parse(schemaText || '{}')
            assert.equal(schema.name, 'Digi02')
            assert.equal(schema.address?.addressLocality, 'Kaduna')

            const overflow = await desktop.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }))
            assert.ok(overflow.scrollWidth <= overflow.clientWidth + 1, `${path} overflows on desktop`)
          }

          await desktop.goto('http://127.0.0.1:4173/not-a-real-page', { waitUntil: 'networkidle' })
          assert.equal(await desktop.locator('meta[name="robots"]').getAttribute('content'), 'noindex, nofollow')

          await desktop.goto('http://127.0.0.1:4173/foundation', { waitUntil: 'networkidle' })
          assert.equal(await desktop.locator('meta[name="robots"]').getAttribute('content'), 'noindex, nofollow')

          await desktop.goto('http://127.0.0.1:4173/contact', { waitUntil: 'networkidle' })
          await desktop.locator('input[name="name"]').fill('QA Visitor')
          await desktop.locator('input[name="email"]').fill('qa@example.com')
          await desktop.locator('input[name="organization"]').fill('QA Organization')
          await desktop.locator('input[name="phone"]').fill('+2348000000000')
          await desktop.locator('select[name="area"]').selectOption({ label: 'Custom software or integration' })
          await desktop.locator('textarea[name="project"]').fill('Connect an existing operational workflow to a clearer record and approval process.')
          await desktop.getByRole('button', { name: 'Prepare enquiry' }).click()
          await desktop.getByText('nothing has been sent automatically', { exact: false }).waitFor({ state: 'visible' })
          await desktop.getByRole('button', { name: 'Copy prepared enquiry' }).waitFor({ state: 'visible' })
          await desktop.screenshot({ path: 'production-readiness-qa/contact-desktop.png', fullPage: true })

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } })
          for (const path of publicRoutes) {
            await mobile.goto(`http://127.0.0.1:4173${path}`, { waitUntil: 'networkidle' })
            const overflow = await mobile.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }))
            assert.ok(overflow.scrollWidth <= overflow.clientWidth + 1, `${path} overflows on mobile`)
          }

          await mobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
          await mobile.screenshot({ path: 'production-readiness-qa/home-mobile.png', fullPage: true })
          await mobile.goto('http://127.0.0.1:4173/company', { waitUntil: 'networkidle' })
          await mobile.screenshot({ path: 'production-readiness-qa/company-mobile.png', fullPage: true })
          await mobile.goto('http://127.0.0.1:4173/contact', { waitUntil: 'networkidle' })
          await mobile.screenshot({ path: 'production-readiness-qa/contact-mobile.png', fullPage: true })

          await desktop.close()
          await mobile.close()
          await browser.close()
          NODE

      - name: Upload production QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-qa
          path: production-readiness-qa
          retention-days: 2
