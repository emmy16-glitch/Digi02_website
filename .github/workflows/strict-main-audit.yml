name: Strict main audit

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: strict-main-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Repository hygiene guard
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          const errors=[]
          for(const forbidden of ['.manual-backups','artifacts','playwright-report','test-results']) if(fs.existsSync(forbidden)) errors.push(`production tree contains ${forbidden}`)
          const files=[]
          const walk=(dir)=>{if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);e.isDirectory()?walk(p):files.push(p)}}
          ;['src','public'].forEach(walk)
          const banned=[['TODO',/\bTODO\b/],['FIXME',/\bFIXME\b/],['debugger',/\bdebugger\b/],['console.log',/console\.log\s*\(/],['localhost',/localhost(?::\d+)?/i],['javascript URL',/href\s*=\s*["']javascript:/i],['empty href',/href\s*=\s*["']#["']/i]]
          for(const file of files){
            if(!/\.(ts|tsx|js|jsx|css|html|xml|txt)$/.test(file) && !file.endsWith('_headers') && !file.endsWith('_redirects')) continue
            const text=fs.readFileSync(file,'utf8')
            for(const [label,pattern] of banned) if(pattern.test(text)) errors.push(`${file}: ${label}`)
          }
          const app=fs.readFileSync('src/App.tsx','utf8')
          if(app.includes("'/foundation'")||app.includes('FOUNDATION_PATH')||app.includes('FoundationPreviewPage')) errors.push('internal foundation preview remains in production App.tsx')
          const readme=fs.readFileSync('README.md','utf8')
          if(/staged implementation branches/i.test(readme)||/\/foundation/.test(readme)) errors.push('README contains stale staging/foundation documentation')
          const workflows=fs.readdirSync('.github/workflows').filter(f=>/\.ya?ml$/.test(f))
          for(const file of workflows){
            if(file==='strict-main-audit.yml') continue
            const text=fs.readFileSync(path.join('.github/workflows',file),'utf8')
            if(/chatgpt\/|feature\//i.test(text)) errors.push(`${file}: temporary branch target remains`)
          }
          const headers=fs.readFileSync('public/_headers','utf8')
          for(const h of ['X-Content-Type-Options','Referrer-Policy','X-Frame-Options','Permissions-Policy','Content-Security-Policy','Strict-Transport-Security']) if(!headers.includes(h)) errors.push(`public/_headers missing ${h}`)
          if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          NODE

  runtime-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install audit browsers and axe
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 >/tmp/digi02-preview.log 2>&1 &
          for i in {1..40}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/digi02-preview.log; exit 1
      - name: Run strict responsive, accessibility and interaction matrix
        run: |
          mkdir -p strict-main-audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { chromium, firefox, webkit } from 'playwright'
          import AxeBuilder from '@axe-core/playwright'

          const origin='http://127.0.0.1:4173'
          const routes=[['home','/'],['solutions','/solutions'],['skygrid','/solutions/skygrid'],['digivolt','/solutions/digivolt'],['enterprise','/solutions/enterprise-systems'],['e-management','/solutions/e-management'],['payroll','/solutions/payroll-automation'],['payments','/solutions/payment-systems'],['custom-software','/solutions/custom-software'],['industries','/industries'],['work','/work'],['company','/company'],['insights','/insights'],['contact','/contact']]
          const publicPaths=new Set(routes.map(([,p])=>p))
          const viewports=[['320',320,720],['360',360,800],['390',390,844],['430',430,932],['768',768,1024],['1024',1024,1366],['1280',1280,900],['1440',1440,1000]]
          const failures=[]; const warnings=[]
          const fail=s=>failures.push(s); const warn=s=>warnings.push(s)

          async function settle(page){
            await page.locator('main#main-content').waitFor()
            await page.evaluate(async()=>{const step=Math.max(innerHeight*.75,400);for(let y=0;y<document.documentElement.scrollHeight;y+=step){scrollTo(0,y);await new Promise(r=>setTimeout(r,15))}scrollTo(0,0);await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})))})
            await page.waitForTimeout(80)
          }

          async function inspect(page,route,label,isPhone){
            const localFailures=[]; const localWarnings=[]
            page.on('pageerror',e=>localFailures.push(`pageerror ${e.message}`))
            page.on('response',r=>{if(r.url().startsWith(origin)&&r.status()>=400)localFailures.push(`${r.status()} ${r.url()}`);else if(!r.url().startsWith(origin)&&r.status()>=400)localWarnings.push(`third-party ${r.status()} ${r.url()}`)})
            page.on('requestfailed',r=>{if(r.url().startsWith(origin))localFailures.push(`request failed ${r.url()} ${r.failure()?.errorText||''}`);else localWarnings.push(`third-party failed ${r.url()}`)})
            page.on('console',m=>{if(m.type()==='error'&&!m.text().startsWith('Failed to load resource'))localFailures.push(`console ${m.text()}`)})
            await page.goto(origin+route,{waitUntil:'networkidle'}); await settle(page)
            const data=await page.evaluate(()=>{const ids=[...document.querySelectorAll('[id]')].map(e=>e.id);return{title:document.title,description:document.querySelector('meta[name="description"]')?.getAttribute('content')||'',robots:document.querySelector('meta[name="robots"]')?.getAttribute('content')||'',canonical:document.querySelector('link[rel="canonical"]')?.getAttribute('href')||'',h1:document.querySelectorAll('main h1').length,mains:document.querySelectorAll('main#main-content').length,dups:[...new Set(ids.filter((id,i)=>ids.indexOf(id)!==i))],cw:document.documentElement.clientWidth,sw:document.documentElement.scrollWidth,broken:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.currentSrc||i.src),missingAlt:[...document.images].filter(i=>!i.hasAttribute('alt')).map(i=>i.currentSrc||i.src),badAnchors:[...document.querySelectorAll('a')].filter(a=>!a.getAttribute('href')||a.getAttribute('href')==='#'||/^javascript:/i.test(a.getAttribute('href')||'')).map(a=>(a.textContent||'').trim()),hrefs:[...new Set([...document.querySelectorAll('a[href^="/"]')].map(a=>a.getAttribute('href')).filter(Boolean))],unlabeled:[...document.querySelectorAll('button,input,textarea,select')].filter(e=>{if(e instanceof HTMLInputElement&&e.type==='hidden')return false;if(e.getAttribute('aria-label')||e.getAttribute('aria-labelledby'))return false;if(e instanceof HTMLButtonElement)return !(e.textContent||'').trim();return !(e.labels&&e.labels.length)}).map(e=>`${e.tagName}:${e.getAttribute('name')||''}`),lang:document.documentElement.lang}})
            if(!data.title.includes('Digi02')) fail(`${label}: title`)
            if(data.description.length<50) fail(`${label}: meta description`)
            if(data.robots!=='index, follow') fail(`${label}: robots ${data.robots}`)
            const canonical=`https://digi02.org${route==='/'?'':route}`; if(data.canonical!==canonical) fail(`${label}: canonical ${data.canonical}`)
            if(data.h1!==1) fail(`${label}: H1 count ${data.h1}`)
            if(data.mains!==1) fail(`${label}: main count ${data.mains}`)
            if(data.dups.length) fail(`${label}: duplicate ids ${data.dups}`)
            if(data.sw>data.cw+1) fail(`${label}: horizontal overflow ${data.sw}/${data.cw}`)
            if(data.broken.length) fail(`${label}: broken images ${data.broken}`)
            if(data.missingAlt.length) fail(`${label}: missing alt ${data.missingAlt}`)
            if(data.badAnchors.length) fail(`${label}: invalid anchors ${data.badAnchors}`)
            if(data.unlabeled.length) fail(`${label}: unlabeled controls ${data.unlabeled}`)
            if(data.lang!=='en') fail(`${label}: html lang ${data.lang}`)
            for(const href of data.hrefs){const p=new URL(href,origin).pathname.replace(/\/$/,'')||'/';if(!publicPaths.has(p))fail(`${label}: unknown internal route ${href}`)}
            const axe=await new AxeBuilder({page}).analyze(); const severe=axe.violations.filter(v=>['serious','critical'].includes(v.impact||'')); if(severe.length) fail(`${label}: axe ${severe.map(v=>`${v.id}(${v.nodes.length})`).join(',')}`)
            if(isPhone){const tiny=await page.locator('header button,header a,form button,form input,form select,form textarea').evaluateAll(es=>es.map(e=>{const r=e.getBoundingClientRect();return{name:(e.textContent||e.getAttribute('aria-label')||e.getAttribute('name')||e.tagName).trim().slice(0,30),w:r.width,h:r.height}}).filter(x=>x.w>0&&x.h>0&&x.h<42));if(tiny.length)fail(`${label}: touch targets ${JSON.stringify(tiny)}`)}
            localFailures.forEach(x=>fail(`${label}: ${x}`)); localWarnings.forEach(x=>warn(`${label}: ${x}`))
          }

          const chrome=await chromium.launch({headless:true}); let passes=0
          for(const [vp,w,h] of viewports){const c=await chrome.newContext({viewport:{width:w,height:h}});for(const [name,route] of routes){const p=await c.newPage();await inspect(p,route,`chromium ${route} @ ${vp}`,w<=430);passes++;if(vp==='390'||vp==='1440')await p.screenshot({path:`strict-main-audit/${name}-${vp}.png`,fullPage:true,animations:'disabled'});await p.close()}await c.close()}

          // Unknown paths, including the retired design preview, must be noindex 404s.
          {const c=await chrome.newContext({viewport:{width:390,height:844}});const p=await c.newPage();for(const route of ['/definitely-not-a-route','/foundation']){await p.goto(origin+route,{waitUntil:'networkidle'});await p.locator('main#main-content').waitFor();const h1=(await p.locator('main h1').textContent())||'';const robots=await p.locator('meta[name="robots"]').getAttribute('content');if(!/not found/i.test(h1))fail(`${route}: not a public 404`);if(robots!=='noindex, nofollow')fail(`${route}: 404 robots ${robots}`)}await c.close()}

          // Reduced-motion preference must suppress long-running animation.
          {const c=await chrome.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});const p=await c.newPage();for(const route of ['/','/solutions/digivolt','/solutions/skygrid']){await p.goto(origin+route,{waitUntil:'networkidle'});await p.waitForTimeout(300);const active=await p.evaluate(()=>document.getAnimations().filter(a=>{const t=a.effect?.getComputedTiming();return a.playState==='running'&&Number(t?.duration||0)>250}).length);if(active)fail(`${route}: reduced-motion has ${active} long animations`)}await c.close()}

          // Mobile navigation: use stable class, because aria-label changes Open -> Close.
          {const c=await chrome.newContext({viewport:{width:390,height:844}});const p=await c.newPage();await p.goto(origin,{waitUntil:'networkidle'});const toggle=p.locator('.mobile-navigation__toggle');if(await toggle.getAttribute('aria-expanded')!=='false')fail('mobile nav: initial aria-expanded');await toggle.click();if(await toggle.getAttribute('aria-expanded')!=='true')fail('mobile nav: did not open');if(await p.locator('body').evaluate(b=>b.style.overflow)!=='hidden')fail('mobile nav: body scroll not locked');await p.keyboard.press('Escape');await p.waitForTimeout(80);if(await toggle.getAttribute('aria-expanded')!=='false')fail('mobile nav: Escape did not close');if(!await toggle.evaluate(e=>document.activeElement===e))fail('mobile nav: focus not restored');await c.close()}

          {const c=await chrome.newContext({viewport:{width:1280,height:900}});const p=await c.newPage();await p.goto(origin,{waitUntil:'networkidle'});const tab=p.getByRole('tab',{name:/Automate/i}).first();await tab.click();await tab.press('End');if(await p.getByRole('tab',{name:/Transact/i}).first().getAttribute('aria-selected')!=='true')fail('home tabs: End key');await c.close()}
          {const c=await chrome.newContext({viewport:{width:1280,height:900}});const p=await c.newPage();await p.goto(origin+'/solutions/digivolt',{waitUntil:'networkidle'});const arrive=p.getByRole('tab',{name:/Arrive/i}).first();await arrive.click();await p.waitForTimeout(700);if(await arrive.getAttribute('aria-selected')!=='true')fail('DigiVolt: Arrive not selected');if(!/Trip complete/i.test((await p.locator('.digivolt-journey__stage-copy').textContent())||''))fail('DigiVolt: Arrive copy');await c.close()}
          {const c=await chrome.newContext({viewport:{width:1280,height:900}});const p=await c.newPage();await p.goto(origin+'/solutions/enterprise-systems',{waitUntil:'networkidle'});const row=p.locator('.erp-pos-product-row').filter({hasText:'Wireless Headset'});const before=(await row.textContent())||'';await row.getByRole('button',{name:'Add'}).click();await p.locator('input[name="erp-pos-payment"][value="Transfer"]').check();await p.getByRole('button',{name:/Complete sale/i}).click();await p.locator('.erp-pos-receipt-drawer[data-open="true"]').waitFor();if((await row.textContent())===before)fail('ERP/POS: stock unchanged');if(!/Transfer/i.test((await p.locator('.erp-pos-receipt__payment').textContent())||''))fail('ERP/POS: receipt payment');await p.getByRole('button',{name:/Reset demo/i}).click();await c.close()}
          {const c=await chrome.newContext({viewport:{width:390,height:844}});const p=await c.newPage();await p.goto(origin+'/contact',{waitUntil:'networkidle'});await p.getByRole('button',{name:/Prepare enquiry/i}).click();if(await p.locator('input[name="name"]:invalid').count()!==1)fail('contact: name validation');if(await p.locator('select[name="area"]:invalid').count()!==1)fail('contact: area validation');if(!/does not send or store/i.test((await p.locator('.contact-form__privacy').textContent())||''))fail('contact: privacy disclosure');await c.close()}
          await chrome.close()

          const smoke=['/','/solutions','/solutions/skygrid','/solutions/digivolt','/solutions/enterprise-systems','/contact']
          for(const [engine,launcher] of [['firefox',firefox],['webkit',webkit]]){const b=await launcher.launch({headless:true});for(const [vp,w,h] of [['phone',390,844],['desktop',1440,1000]]){const c=await b.newContext({viewport:{width:w,height:h}});for(const route of smoke){const p=await c.newPage();await inspect(p,route,`${engine} ${route} @ ${vp}`,w<=430);await p.close()}await c.close()}await b.close()}

          fs.writeFileSync('strict-main-audit/summary.txt',`Chromium route passes: ${passes}\nWarnings: ${warnings.length}\nFailures: ${failures.length}\n${warnings.map(x=>'WARN '+x).join('\n')}\n${failures.map(x=>'FAIL '+x).join('\n')}\n`)
          console.log(`Chromium route passes: ${passes}; warnings: ${warnings.length}; failures: ${failures.length}`)
          warnings.forEach(x=>console.log(`WARN: ${x}`))
          if(failures.length){failures.forEach(x=>console.error(`FAIL: ${x}`));process.exit(1)}
          NODE
      - name: Upload strict audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-main-audit
          path: strict-main-audit
          retention-days: 2
