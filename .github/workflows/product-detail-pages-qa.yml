name: Product detail pages QA

on:
  push:
    branches:
      - chatgpt/product-detail-pages
  workflow_dispatch:

jobs:
  product-pages-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/digi02-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/digi02-preview.log
          exit 1

      - name: Run product-page QA
        run: |
          mkdir -p product-detail-pages-qa
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { chromium } from 'playwright'

          const routes = [
            ['/solutions/skygrid', 'See more. React earlier. Operate smarter.', 'skygrid'],
            ['/solutions/digivolt', 'A connected journey from request to arrival.', 'digivolt'],
            ['/solutions/enterprise-systems', 'Keep the transaction connected to the operation behind it.', 'enterprise'],
          ]

          const browser = await chromium.launch({ headless: true })

          async function assertNoOverflow(page, label) {
            const dimensions = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }))
            assert.ok(
              dimensions.scrollWidth <= dimensions.clientWidth + 1,
              `${label} overflows: ${dimensions.scrollWidth} > ${dimensions.clientWidth}`,
            )
          }

          const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
          for (const [path, heading, slug] of routes) {
            await desktop.goto(`http://127.0.0.1:4173${path}`, { waitUntil: 'networkidle' })
            await desktop.getByRole('heading', { level: 1, name: heading }).waitFor({ state: 'visible' })
            await assertNoOverflow(desktop, `${path} desktop`)
            const solutionsNav = desktop.locator('.desktop-navigation__link[aria-current="page"]')
            assert.equal((await solutionsNav.textContent())?.trim(), 'Solutions')
            await desktop.screenshot({ path: `product-detail-pages-qa/${slug}-desktop.png`, fullPage: true })
          }

          await desktop.goto('http://127.0.0.1:4173/solutions/skygrid', { waitUntil: 'networkidle' })
          const legacySkyGridSources = await desktop.locator('img').evaluateAll((images) =>
            images
              .map((image) => image.getAttribute('src') ?? '')
              .filter((src) => /route-planner|gcs-mission-planner|operations-center|mission-analytics|showcase-concept/.test(src)),
          )
          assert.deepEqual(legacySkyGridSources, [])
          await desktop.getByText(/not a photographed Digi02 deployment/i).waitFor({ state: 'visible' })

          await desktop.goto('http://127.0.0.1:4173/solutions/enterprise-systems', { waitUntil: 'networkidle' })
          const erp = desktop.locator('#erp-pos')
          await erp.scrollIntoViewIfNeeded()
          const headsetRow = erp.locator('.erp-pos-product-row').filter({ hasText: 'Wireless Headset' })
          await headsetRow.getByRole('button', { name: 'Add' }).click()
          await erp.getByRole('button', { name: /Complete sale/ }).click()
          await erp.locator('.erp-pos-receipt-drawer[data-open="true"]').waitFor({ state: 'visible' })

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } })
          for (const [path, heading, slug] of routes) {
            await mobile.goto(`http://127.0.0.1:4173${path}`, { waitUntil: 'networkidle' })
            await mobile.getByRole('heading', { level: 1, name: heading }).waitFor({ state: 'visible' })
            await assertNoOverflow(mobile, `${path} mobile`)
            await mobile.screenshot({ path: `product-detail-pages-qa/${slug}-mobile.png`, fullPage: true })
          }

          await desktop.close()
          await mobile.close()
          await browser.close()
          NODE

      - name: Upload product-page QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: product-detail-pages-qa
          path: product-detail-pages-qa/
          retention-days: 2
