name: Solutions visual reset QA

on:
  push:
    branches:
      - chatgpt/solutions-visual-reset

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/digi02-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/solutions > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/digi02-preview.log
          exit 1

      - name: Capture solutions page
        run: |
          mkdir -p solutions-visual-reset-qa
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { chromium } from 'playwright'

          const browser = await chromium.launch()
          const cases = [
            ['desktop-1440', 1440, 1000],
            ['tablet-1024', 1024, 900],
            ['mobile-390', 390, 844],
          ]

          for (const [name, width, height] of cases) {
            const page = await browser.newPage({ viewport: { width, height } })
            await page.goto('http://127.0.0.1:4173/solutions', { waitUntil: 'domcontentloaded' })
            await page.evaluate(() => document.fonts.ready)
            await page.waitForTimeout(700)

            const state = await page.evaluate(() => {
              const h1 = document.querySelector('h1')
              const car = document.querySelector('.digivolt-preview__car')
              const carRect = car?.getBoundingClientRect()
              const brokenImages = Array.from(document.images)
                .filter((image) => !image.complete || image.naturalWidth === 0)
                .map((image) => image.getAttribute('src'))

              return {
                bodyWidth: document.body.scrollWidth,
                viewportWidth: window.innerWidth,
                brokenImages,
                h1Text: h1?.textContent?.trim(),
                h1Size: h1 ? Number.parseFloat(getComputedStyle(h1).fontSize) : 0,
                carWidth: carRect?.width ?? 0,
                carHeight: carRect?.height ?? 0,
              }
            })

            assert.equal(state.h1Text, 'Technology built around the operation.')
            assert.ok(state.bodyWidth <= state.viewportWidth + 1, `${name}: horizontal overflow ${state.bodyWidth}/${state.viewportWidth}`)
            assert.deepEqual(state.brokenImages, [], `${name}: broken images found`)
            assert.ok(state.carWidth >= 80 && state.carHeight > 0, `${name}: DigiVolt vehicle did not render at a useful size`)
            if (width <= 390) {
              assert.ok(state.h1Size <= 49, `${name}: mobile H1 is too large (${state.h1Size}px)`)
            }

            await page.screenshot({
              path: `solutions-visual-reset-qa/${name}.png`,
              fullPage: true,
            })
            await page.close()
          }

          await browser.close()
          NODE

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: solutions-visual-reset-qa
          path: solutions-visual-reset-qa
          retention-days: 1
