name: Digi02 production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: digi02-production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, test, typecheck, lint, build, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and contract tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: Browser production smoke matrix
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          PREVIEW_PID=$!
          npx wait-on http://127.0.0.1:4173/ --timeout 60000
          SMOKE_BASE=http://127.0.0.1:4173 node scripts/smoke.mjs
          STATUS=$?
          kill $PREVIEW_PID
          exit $STATUS
