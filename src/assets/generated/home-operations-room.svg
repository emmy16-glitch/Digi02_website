    <radialGradient id="goldGlow" cx="0.72" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#C9A34A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C9A34A" stop-opacity="0"/>
