<svg viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Digi02 national operations room overlooking Kaduna with live logistics and infrastructure dashboards">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06101a"/>
      <stop offset="0.5" stop-color="#0a1a29"/>
      <stop offset="0.78" stop-color="#171814"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b1b"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#050505" stop-opacity="0.93"/>
      <stop offset="0.43" stop-color="#050505" stop-opacity="0.56"/>
      <stop offset="0.62" stop-color="#050505" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
